services:

  db:
    image: postgres:16-alpine
    container_name: giftrwa_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: giftrwa_db
      POSTGRES_USER: giftrwa_user
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - giftrwa_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U giftrwa_user -d giftrwa_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./giftwebsite
      dockerfile: Dockerfile
    container_name: giftrwa_backend
    restart: unless-stopped
    environment:
      SECRET_KEY: ${SECRET_KEY}
      DEBUG: "False"
      DB_NAME: giftrwa_db
      DB_USER: giftrwa_user
      DB_PASSWORD: ${DB_PASSWORD}
      DB_HOST: db
      DB_PORT: "5432"
      EMAIL_HOST_USER: shemaroger43@gmail.com
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD}
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET}
      GOOGLE_OAUTH_REDIRECT_URI: https://www.giftrwa.org/api/google-drive/callback/
      GOOGLE_DRIVE_TOKEN_FILE: secrets/google-drive-token.json
      GOOGLE_DRIVE_ROOT_FOLDER_NAME: GiftApp Storage
      FRONTEND_URL: https://www.giftrwa.org
      BACKEND_BASE_URL: https://www.giftrwa.org
    volumes:
      # Without this, `docker compose build --no-cache` wipes the Google
      # Drive OAuth refresh token (and any other file under secrets/) on
      # every single deploy, forcing re-authorization each time.
      - backend_secrets:/app/secrets
    depends_on:
      db:
        condition: service_healthy
    networks:
      - giftrwa_network

  frontend:
    build:
      context: ./gift-frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: https://www.giftrwa.org/api
        VITE_API: https://www.giftrwa.org/api
    container_name: giftrwa_frontend
    restart: unless-stopped
    networks:
      - giftrwa_network

volumes:
  postgres_data:
  backend_secrets:

networks:
  giftrwa_network:
    driver: bridge